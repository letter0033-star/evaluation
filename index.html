<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교사 다면평가·근무성적평정 프로그램 (2025학년도, PC용)</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --ink:#1d2433; --muted:#667085; --line:#d9dde4; --line2:#eceef2;
  --brand:#1f4e8c; --brand2:#2f6fbf; --brandbg:#e9f0fa;
  --ok:#1a7f45; --okbg:#e7f5ec; --warn:#a15c00; --warnbg:#fff4e0; --err:#b42318; --errbg:#fdecea;
  --su:#1f4e8c; --u:#2f855a; --mi:#a15c00; --yang:#b42318;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;font-size:14px;color:var(--ink);background:var(--bg);line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
#side{background:#14233b;color:#d7deea;padding:18px 0;position:sticky;top:0;height:100vh;overflow:auto}
#side h1{font-size:15px;line-height:1.35;margin:0 18px 4px;color:#fff;font-weight:700}
#side .sub{font-size:12px;margin:0 18px 16px;color:#9fb0c8}
#side ol{list-style:none;margin:0;padding:0;counter-reset:s}
#side li button{all:unset;display:flex;gap:10px;align-items:flex-start;width:100%;box-sizing:border-box;padding:9px 18px;cursor:pointer;font-size:13.5px}
#side li button:hover{background:#1c3152}
#side li button.on{background:#24406b;color:#fff;box-shadow:inset 3px 0 0 #7fb2ff}
#side .num{flex:none;width:22px;height:22px;border-radius:50%;background:#2a4268;color:#cfe0ff;display:grid;place-items:center;font-size:12px;font-weight:700}
#side .num.done{background:#2f855a;color:#fff}
#side .num.bad{background:#b42318;color:#fff}
#side .stat{display:block;font-size:11.5px;color:#9fb0c8;margin-top:1px}
#side .foot{margin:18px;font-size:11.5px;color:#8ea0bb;border-top:1px solid #2a3c59;padding-top:12px}
#side .foot button{all:unset;cursor:pointer;display:block;color:#cfe0ff;margin:6px 0;font-size:12.5px}
#side .foot button:hover{text-decoration:underline}
main{padding:24px 32px 80px;max-width:1280px}
h2{font-size:21px;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.card h3{font-size:15.5px;margin:0 0 10px}
.card h3 small{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 20px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#344054}
label.f span{font-weight:600}
input[type=text],input[type=number],input:not([type]),select,textarea{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #a9c7f5;border-color:var(--brand2)}
input.num{width:64px;text-align:right}
input.rk{width:56px;text-align:center;font-weight:700}
input.bad,select.bad{background:var(--errbg);border-color:#f3a59c}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13.5px;white-space:nowrap}
.btn:hover{background:#f2f4f7}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:#183f72}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn.danger{color:var(--err)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.spacer{flex:1}
table.t{border-collapse:collapse;width:100%;font-size:13px;background:#fff}
table.t th,table.t td{border:1px solid var(--line);padding:5px 6px;text-align:center;vertical-align:middle}
table.t th{background:#f2f4f7;font-weight:600;color:#344054}
table.t td.l{text-align:left;white-space:nowrap}
table.t td.r{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.self td{background:#f7f7f7;color:#98a2b3}
table.t tr.hl td{background:#fff8e6}
table.t tr.err td{background:#fff1f0}
.tbl-wrap{overflow:auto;max-width:100%}
.note{font-size:12.5px;color:var(--muted)}
.msg{border-radius:8px;padding:10px 12px;margin:8px 0;font-size:13.5px}
.msg.err{background:var(--errbg);color:var(--err);border:1px solid #f6c3bd}
.msg.warn{background:var(--warnbg);color:var(--warn);border:1px solid #f4d39c}
.msg.ok{background:var(--okbg);color:var(--ok);border:1px solid #b5dfc3}
.msg.info{background:var(--brandbg);color:#1d3d6b;border:1px solid #c6d8f2}
.msg ul{margin:4px 0 0 18px;padding:0}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.err{background:var(--errbg);color:var(--err)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.mute{background:#eef0f3;color:#667085}
.g-수{color:var(--su);font-weight:700}.g-우{color:var(--u);font-weight:700}.g-미{color:var(--mi);font-weight:700}.g-양{color:var(--yang);font-weight:700}
.steps{counter-reset:k;margin:0;padding:0;list-style:none}
.steps li{counter-increment:k;position:relative;padding:6px 0 6px 34px}
.steps li::before{content:counter(k);position:absolute;left:0;top:6px;width:24px;height:24px;border-radius:50%;background:var(--brandbg);color:var(--brand);font-weight:700;display:grid;place-items:center;font-size:12.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv b{color:#344054}
.dist{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.dist .box{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
.dist .box h4{margin:0 0 6px;font-size:12.5px;color:var(--muted);font-weight:600}
.dist .box .v{font-size:15px;font-variant-numeric:tabular-nums}
.dist .box.bad{border-color:#f3a59c;background:#fff6f5}
.dist .box.good{border-color:#a9d8b8;background:#f4fbf6}
details.adj{margin-top:4px}
details.adj summary{cursor:pointer;color:var(--brand2);font-size:12.5px}
.mini{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:7px 12px;border-radius:6px 6px 0 0;font-size:13.5px;color:#475467}
.tabs button.on{background:#fff;border:1px solid var(--line);border-bottom-color:#fff;margin-bottom:-1px;color:var(--brand);font-weight:700}
.doclist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.doclist label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;cursor:pointer;font-size:13px}
.doclist label:hover{border-color:var(--brand2)}
.doclist small{display:block;color:var(--muted);font-size:11.5px}
dialog{border:none;border-radius:12px;padding:0;max-width:min(920px,94vw);box-shadow:0 20px 50px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(16,24,40,.45)}
dialog .dh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
dialog .dh h3{margin:0;font-size:16px}
dialog .db{padding:14px 18px;max-height:70vh;overflow:auto}
dialog .df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
#toast{position:fixed;right:20px;bottom:20px;background:#14233b;color:#fff;padding:10px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99;font-size:13.5px}
#toast.on{opacity:.95}

/* ── 인쇄 미리보기·인쇄 ─────────────────────────── */
#preview{background:#8a919c;padding:20px;border-radius:10px;overflow:auto;max-height:78vh}
.page{background:#fff;width:210mm;min-height:297mm;margin:0 auto 16px;padding:14mm 12mm;box-shadow:0 2px 10px rgba(0,0,0,.25);font-family:"Malgun Gothic","맑은 고딕",sans-serif;color:#000;font-size:10pt;position:relative}
.page.land{width:297mm;min-height:210mm}
.page .flabel{font-size:8.5pt;margin:0 0 2px;white-space:pre-line}
.page .fpage{position:absolute;right:12mm;top:14mm;font-size:9pt}
.page h1{text-align:center;font-size:15pt;margin:4mm 0 4mm;letter-spacing:.5px}
.page h1.u{text-decoration:underline;text-underline-offset:4px}
.page .sub{font-size:10pt;margin:0 0 2mm}
.page table{border-collapse:collapse;width:100%}
.page th,.page td{border:1px solid #000;padding:1.2mm 1mm;text-align:center;vertical-align:middle;font-size:9pt;line-height:1.3}
.page th{font-weight:600;background:#f3f3f3}
.page td.l{text-align:left}
.page td.r{text-align:right}
.page .sig{display:flex;justify-content:flex-end;gap:12mm;margin-top:5mm;font-size:10pt}
.page .remark{font-size:8.5pt;margin-top:3mm;white-space:pre-line;line-height:1.45;border:1px solid #000;padding:2mm 3mm}
.page .foot{font-size:8pt;text-align:right;margin-top:2mm;color:#333}
.page .hdr td{font-size:9pt}
.page .blank{color:transparent}
.page .tight th,.page .tight td{font-size:8pt;padding:.8mm .5mm}
.page .xtight th,.page .xtight td{font-size:7pt;padding:.6mm .3mm}
.page .watermark{position:absolute;top:6mm;left:12mm;font-size:8.5pt;border:1px solid #000;padding:.5mm 2mm}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  #app>*:not(main),main>*:not(#printZone),#printZone>*:not(#preview),#toast,dialog{display:none !important}
  #app{display:block}
  main{padding:0;max-width:none}
  #printZone{display:block !important}
  #preview{background:none;padding:0;max-height:none;overflow:visible;border-radius:0}
  .page{box-shadow:none;margin:0;page-break-after:always;break-after:page;min-height:auto;height:auto}
  .page:last-child{page-break-after:auto;break-after:auto}
  .page th{background:#f3f3f3 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

  const BJ = [[1,0,0,0],[1,1,0,0],[1,1,1,0],[1,2,1,0],[2,2,1,0],[2,2,1,1],[2,3,1,1],[3,3,1,1],[3,3,2,1],[3,4,2,1],[3,5,2,1],[4,5,2,1],[4,5,3,1],[4,6,3,1],[5,6,3,1],[5,6,3,2],[5,7,3,2],[6,7,3,2],[6,7,4,2],[6,8,4,2],[6,9,4,2],[7,9,4,2],[7,9,5,2],[7,10,5,2],[8,10,5,2],[8,10,5,3],[8,11,5,3],[9,11,5,3],[9,11,6,3],[9,12,6,3],[9,13,6,3],[10,13,6,3],[10,13,7,3],[10,14,7,3],[11,14,7,3],[11,14,7,4],[11,15,7,4],[12,15,7,4],[12,15,8,4],[12,16,8,4],[12,17,8,4],[13,17,8,4],[13,17,9,4],[13,18,9,4],[14,18,9,4],[14,18,9,5],[14,19,9,5],[15,19,9,5],[15,19,10,5],[15,20,10,5],[15,21,10,5],[16,21,10,5],[16,21,11,5],[16,22,11,5],[17,22,11,5],[17,22,11,6],[17,23,11,6],[18,23,11,6],[18,23,12,6],[18,24,12,6],[18,25,12,6],[19,25,12,6],[19,25,13,6],[19,26,13,6],[20,26,13,6],[20,26,13,7],[20,27,13,7],[21,27,13,7],[21,27,14,7],[21,28,14,7],[21,29,14,7],[22,29,14,7],[22,29,15,7],[22,30,15,7],[23,30,15,7],[23,30,15,8],[23,31,15,8],[24,31,15,8],[24,31,16,8],[24,32,16,8],[24,33,16,8],[25,33,16,8],[25,33,17,8],[25,34,17,8],[26,34,17,8],[26,34,17,9],[26,35,17,9],[27,35,17,9],[27,35,18,9],[27,36,18,9],[27,37,18,9],[28,37,18,9],[28,37,19,9],[28,38,19,9],[29,38,19,9],[29,38,19,10],[29,39,19,10],[30,39,19,10],[30,39,20,10],[30,40,20,10]];

  const JG = JG_ENC.map(segs => {
    const col = [];
    segs.forEach(([a, d, n]) => { for (let k = 0; k < n; k++) col.push(Math.round((a + d * k) * 1000) / 1000); });
    return col;
  });

  // ── 엑셀 ROUND / ROUNDDOWN 과 같은 결과를 내도록(부동소수 오차 제거 후 처리)
  const clean = x => Number(Number(x).toPrecision(12));
  function round(x, d = 2) { const m = 10 ** d; const v = clean(Math.abs(x) * m); return Math.sign(x) * Math.round(v) / m; }
  function rounddown(x, d = 2) { const m = 10 ** d; const v = clean(Math.abs(x) * m); return Math.sign(x) * Math.floor(v) / m; }
  const add = (...a) => round(a.reduce((s, v) => s + (Number(v) || 0), 0), 3);

  /** 조견표 점수: N명 중 rank위 */
  function table(rank, N) {
    if (!(N >= 1 && N <= 100)) return null;
    if (!(rank >= 1)) return null;
    const r = Math.min(Math.round(rank), N);  // 엑셀: 순위가 대상자 수보다 크면 대상자 수로 처리
    return JG[N - 1][r - 1];
  }
  function baejeong(N) { return N >= 1 && N <= 100 ? BJ[N - 1].slice() : null; }
  function grade(s) { if (s == null || s === '' || isNaN(s)) return ''; s = clean(s); return s >= 95 ? '수' : s >= 90 ? '우' : s >= 85 ? '미' : '양'; }
  /** 승진규정 제28조의4: 평가대상자 수별 최소 다면평가자 수 */
  function minEvaluators(N) { return N <= 15 ? 3 : N <= 20 ? 4 : N <= 25 ? 5 : N <= 30 ? 6 : N <= 35 ? 7 : 8; }

  // 정성평가 요소: [이름, 배점, 조견표점수에 곱하는 계수]  (학습지도는 총점-나머지)
  const QUAL = [
    { key: 'att', name: '교육공무원으로서의 태도', short: '태도', max: 10, f: 0.1 },
    { key: 'learn', name: '학습지도', short: '학습지도', max: 40, f: null },
    { key: 'life', name: '생활지도', short: '생활지도', max: 30, f: 0.3 },
    { key: 'pro', name: '전문성개발', short: '전문성개발', max: 5, f: 0.05 },
    { key: 'duty', name: '담당업무', short: '담당업무', max: 15, f: 0.15 }
  ];
  const QUANT = [
    { key: 'learn', name: '학습지도', max: 30 },
    { key: 'life', name: '생활지도', max: 30 },
    { key: 'pro', name: '전문성개발', max: 10 },
    { key: 'duty', name: '담당업무', max: 30 }
  ];
  // 근무성적평정 요소 계수(평정점 100점 기준)
  const GP_F = [0.1, 0.4, 0.3, 0.05, 0.15];

  /** [서식1] 다면평가자 1명이 매긴 한 사람의 요소별 점수 — 평가자평가표 C~H열 */
  function qualFromScore(t) {
    if (t == null || t === '' || isNaN(t)) return null;
    const total = round(t, 2);
    const att = round(t / 10, 2), life = round(t / 10 * 3, 2), pro = round(t / 10 * 0.5, 2), duty = round(t / 10 * 1.5, 2);
    const learn = round(total - att - life - pro - duty, 2);
    return { el: [att, learn, life, pro, duty], total };
  }

  function targets(st) { return st.people.filter(p => p.target && p.name); }
  function evaluators(st) { return st.people.filter(p => p.evaluator && p.name); }

  /** 다면평가자 한 명이 평가해야 할 대상자(본인 제외)와 실평가대상자 수 */
  function evalScope(st, evId) {
    const list = targets(st).filter(p => p.id !== evId);
    return { list, N: list.length };
  }

  /** 다면평가자 한 명의 서식1 행 */
  function qualSheet(st, evId) {
    const { list, N } = evalScope(st, evId);
    const q = (st.qual && st.qual[evId]) || {};
    const direct = q.mode === 'score';
    const rows = list.map(p => {
      let rank = q.ranks ? q.ranks[p.id] : null;
      rank = rank === '' || rank == null ? null : Number(rank);
      let raw = null;
      if (direct) { const s = q.scores ? q.scores[p.id] : null; raw = s === '' || s == null ? null : Number(s); }
      else if (rank) raw = table(rank, N);
      const r = qualFromScore(raw);
      return { id: p.id, name: p.name, rank, raw, el: r ? r.el : null, total: r ? r.total : null };
    });
    // 점검
    const issues = [];
    if (!direct) {
      const seen = {};
      rows.forEach(r => { if (r.rank) seen[r.rank] = (seen[r.rank] || 0) + 1; });
      rows.forEach(r => {
        r.dup = r.rank && seen[r.rank] > 1;
        r.bad = r.rank != null && (!(r.rank >= 1 && r.rank <= N) || !Number.isInteger(r.rank));
      });
      const missing = []; for (let k = 1; k <= N; k++) if (!seen[k]) missing.push(k);
      if (rows.some(r => r.rank == null)) issues.push('순위를 입력하지 않은 대상자가 있습니다.');
      if (rows.some(r => r.dup)) issues.push('중복된 순위가 있습니다.');
      if (rows.some(r => r.bad)) issues.push(`순위는 1~${N} 사이의 정수여야 합니다.`);
      if (!issues.length && missing.length) issues.push('누락된 순위: ' + missing.join(', '));
    } else {
      rows.forEach(r => { r.bad = r.raw != null && (r.raw < 85 || r.raw > 100); });
      if (rows.some(r => r.raw == null)) issues.push('점수를 입력하지 않은 대상자가 있습니다.');
      if (rows.some(r => r.bad)) issues.push('직접 입력 점수는 85~100점 범위여야 합니다.');
      const tot = rows.filter(r => r.total != null).map(r => r.total);
      if (new Set(tot).size !== tot.length) issues.push('동점이 있습니다(특별한 사정이 없으면 동점을 주지 않음).');
    }
    rows.forEach(r => { if (r.el && r.el[1] > 40) issues.push(`${r.name}: 학습지도 점수가 40점을 넘습니다.`); });
    const complete = rows.length > 0 && rows.every(r => r.total != null) && !issues.length;
    return { N, rows, issues, complete, direct };
  }

  /** [서식1-1] 요소별 집계: 최고·최저 제외(평가자 4인 이상), 평균 */
  function aggregate(vals) {
    const v = vals.filter(x => x != null);
    const cnt = v.length;
    if (!cnt) return { cnt, sum: null, avg: null, max: null, min: null };
    const s = add(...v), mx = Math.max(...v), mn = Math.min(...v);
    const sum = cnt < 4 ? s : add(s, -mx, -mn);
    const avg = cnt < 4 ? round(sum / cnt, 2) : round(sum / (cnt - 2), 2);
    return { cnt, sum, avg, max: mx, min: mn, dropped: cnt >= 4 };
  }

  function rates(st, mode) {
    if (mode === 'perf') return { qual: Number(st.perfRate?.qual ?? 20), quant: Number(st.perfRate?.quant ?? 80) };
    return { qual: 32, quant: 8 };
  }

  /** 전체 계산 */
  function compute(st, mode = 'promo') {
    const T = targets(st), E = evaluators(st);
    const N = T.length;
    const R = rates(st, mode);
    const sheets = {}; E.forEach(e => { sheets[e.id] = qualSheet(st, e.id); });
    const byId = {};
    T.forEach((p, i) => {
      const o = { id: p.id, idx: i + 1, name: p.name, person: p };
      // 정성: 요소별 다면평가자 점수
      o.qualBy = E.map(e => { const r = sheets[e.id].rows.find(x => x.id === p.id); return r && r.el ? r.el : null; });
      o.qualAgg = QUAL.map((q, k) => aggregate(o.qualBy.map(el => el ? el[k] : null)));
      const qAvgs = o.qualAgg.map(a => a.avg);
      o.qualEl = qAvgs;
      o.qualTotal = qAvgs.every(v => v != null) ? add(...qAvgs) : null;
      o.qualConv = o.qualTotal != null ? round(o.qualTotal * R.qual / 100, 2) : null;
      // 정량
      const qn = (st.quant && st.quant[p.id]) || [];
      o.quantEl = QUANT.map((q, k) => (qn[k] === '' || qn[k] == null) ? null : Number(qn[k]));
      o.quantTotal = o.quantEl.every(v => v != null) ? add(...o.quantEl) : null;
      o.quantConv = o.quantTotal != null ? round(o.quantTotal * R.quant / 100, 2) : null;
      // 다면 합산
      o.dmTotal = (o.qualConv != null && o.quantConv != null) ? add(o.qualConv, o.quantConv) : null;
      // 근무성적평정
      const g = (st.gp && st.gp[p.id]) || {};
      const mk = (who) => {
        const rk = g[who] === '' || g[who] == null ? null : Number(g[who]);
        const base = rk ? table(rk, N) : null;
        const auto = GP_F.map(f => base == null ? null : rounddown(base * f, 2));
        const ov = (g.ov && g.ov[who]) || [];
        const el = auto.map((v, k) => (ov[k] === '' || ov[k] == null) ? v : Number(ov[k]));
        const score = el.every(v => v != null) ? add(...el) : null;
        const conv = score == null ? null : round(score * (who === 'p' ? 0.2 : 0.4), 2);
        return { rank: rk, base, auto, el, manual: ov.some(v => v !== '' && v != null), score, conv };
      };
      o.gpP = mk('p'); o.gpQ = mk('q');
      o.gpTotal = (o.gpP.conv != null && o.gpQ.conv != null) ? add(o.gpP.conv, o.gpQ.conv) : null;
      o.total = (o.gpTotal != null && o.dmTotal != null) ? add(o.gpP.conv, o.gpQ.conv, o.dmTotal) : null;
      byId[p.id] = o;
    });
    const list = T.map(p => byId[p.id]);
    // 순위 (엑셀 RANK: 내림차순, 동점은 같은 순위)
    const rk = (key) => { const vals = list.map(o => o[key]).filter(v => v != null); list.forEach(o => { o[key + 'Rank'] = o[key] == null ? null : 1 + vals.filter(v => v > o[key]).length; }); };
    rk('total'); rk('dmTotal'); rk('qualTotal'); rk('quantTotal'); rk('gpTotal');
    list.forEach(o => {
      // ⑧ 조정점(참고값: 실제 조정점은 교육지원청 작성). 엑셀 조견표의 부동소수 오차(예: 30명 21위 89.996)로
      //    배정표와 어긋나는 일이 없도록 소수 둘째 자리로 반올림해 등급을 판정
      o.adj = o.totalRank ? round(table(o.totalRank, N), 2) : null;
      o.gradeAdj = grade(o.adj);
      o.gradeTotal = grade(o.total);
      o.gradeP = grade(o.gpP.score); o.gradeQ = grade(o.gpQ.score);
    });
    return { N, list, byId, sheets, E, T, R, mode, checks: checks(st, list, N, E, sheets) };
  }

  function countGrades(arr) {
    const c = { 수: 0, 우: 0, 미: 0, 양: 0 };
    arr.forEach(g => { if (c[g] != null) c[g]++; });
    return c;
  }
  /** 배정표와 비교(양은 미에 포함 가능) */
  function distOK(c, N) {
    const b = baejeong(N); if (!b) return false;
    return c.수 === b[0] && c.우 === b[1] && (c.미 + c.양) === (b[2] + b[3]);
  }

  function checks(st, list, N, E, sheets) {
    const out = { errors: [], warns: [], gp: {} };
    if (N === 0) { out.errors.push('평가대상자가 없습니다.'); return out; }
    if (N > 100) out.errors.push('평가대상자는 100명까지 처리할 수 있습니다.');
    const need = minEvaluators(N);
    if (E.length < need) out.errors.push(`평가대상자 ${N}명에는 다면평가자가 ${need}명 이상 필요합니다(현재 ${E.length}명).`);
    // 순위 중복·누락 (평정자/확인자)
    ['p', 'q'].forEach(w => {
      const label = w === 'p' ? '평정자(교감)' : '확인자(교장)';
      const rs = list.map(o => (w === 'p' ? o.gpP : o.gpQ).rank);
      const seen = {}; rs.forEach(r => { if (r) seen[r] = (seen[r] || 0) + 1; });
      const dup = Object.keys(seen).filter(k => seen[k] > 1);
      const miss = []; for (let k = 1; k <= N; k++) if (!seen[k]) miss.push(k);
      out.gp[w] = { dup: dup.map(Number), miss };
      if (rs.some(r => r == null)) out.warns.push(`${label} 순위가 입력되지 않은 교사가 있습니다.`);
      else {
        if (dup.length) out.errors.push(`${label} 순위 중복: ${dup.join(', ')}`);
        if (miss.length) out.errors.push(`${label} 순위 누락: ${miss.join(', ')}`);
      }
    });
    const done = list.every(o => o.total != null);
    out.done = done;
    if (done) {
      const cT = countGrades(list.map(o => o.gradeTotal));
      const cA = countGrades(list.map(o => o.gradeAdj));
      const cP = countGrades(list.map(o => o.gradeP));
      const cQ = countGrades(list.map(o => o.gradeQ));
      out.dist = { total: cT, adj: cA, p: cP, q: cQ, bj: baejeong(N) };
      out.mismatch = list.filter(o => o.gradeTotal !== o.gradeAdj).map(o => o.id);
      if (out.mismatch.length) out.errors.push('⑦총점 기준 등급과 ⑧조정점 기준 등급이 일치하지 않습니다(평정분포 비율 불일치).');
      if (!distOK(cP, N)) out.errors.push('평정자(교감) 평정점의 수·우·미 분포가 배정표와 다릅니다.');
      if (!distOK(cQ, N)) out.errors.push('확인자(교장) 평정점의 수·우·미 분포가 배정표와 다릅니다.');
      const tots = list.map(o => o.total);
      const ties = list.filter(o => tots.filter(t => t === o.total).length > 1).map(o => o.name);
      if (ties.length) out.errors.push('합산 총점 동점자: ' + [...new Set(ties)].join(', ') + ' (합산점은 동일하지 않도록 해야 함)');
      list.forEach(o => {
        const d = o.person.discipline;
        if (d === '징계' && ['수', '우'].includes(o.gradeTotal)) out.errors.push(`${o.name}: 징계(견책 이상)자는 '우' 이상 평정 불가`);
        if (d === '불문경고' && o.gradeTotal === '수') out.errors.push(`${o.name}: 불문경고자는 '수' 평정 불가`);
        [o.gpP, o.gpQ].forEach((g, k) => {
          if (g.score > 100) out.errors.push(`${o.name}: ${k ? '확인자' : '평정자'} 평정점이 100점을 넘습니다.`);
          g.el.forEach((v, j) => { if (v > GP_F[j] * 100 + 1e-9) out.errors.push(`${o.name}: ${k ? '확인자' : '평정자'} ${QUAL[j].short} 점수가 배점(${GP_F[j] * 100})을 넘습니다.`); });
        });
        if (o.gpTotal > 60) out.errors.push(`${o.name}: 근무성적평정 총점이 60점을 넘습니다.`);
      });
      if (list.some(o => o.gradeTotal === '양')) out.warns.push("'양' 평정자가 있습니다. 징계 등 사유가 있는 경우에만 부여하며 교육지원청 인사담당과 협의가 필요합니다.");
    }
    return out;
  }

  /** 수동조정 도우미: 등급이 어긋난 교사에 대해 현재 등급을 유지하면서 깎을 수 있는 폭 */
  function adjustHint(o) {
    const lo = s => s >= 95 ? 95 : s >= 90 ? 90 : s >= 85 ? 85 : 0;
    const res = {};
    if (o.total == null) return null;
    const target = o.gradeAdj; // 맞춰야 할 등급
    const band = { 수: [95, 100], 우: [90, 94.99], 미: [85, 89.99], 양: [0, 84.99] }[target];
    res.target = target; res.band = band;
    res.need = o.total > band[1] ? round(o.total - band[1], 2) : o.total < band[0] ? round(o.total - band[0], 2) : 0;

  }


  /**
   * 자동 수동조정: 순위(⑨)는 그대로 두고 평정자·확인자 요소 점수만 고쳐서

   *  - 각 요소는 배점 이내

   */
  function autoAdjust(st) {
    const C = compute(st);
    const N = C.N; const res = { ok: false, changes: [], fail: [], ov: {} };

    if (C.list.some(o => o.dmTotal == null)) { res.fail.push('다면평가 점수가 없는 교사가 있습니다.'); return res; }
    const g = C.checks.gp;
    if (C.list.some(o => o.gpP.rank == null || o.gpQ.rank == null) || g.p.dup.length || g.p.miss.length || g.q.dup.length || g.q.miss.length) { res.fail.push('평정자·확인자 순위가 1~' + N + '위까지 빠짐·중복 없이 입력되어야 합니다.'); return res; }
    const BAND = { 수: [95, 100], 우: [90, 94.99], 미: [85, 89.99], 양: [0, 84.99] };
    const c100 = x => Math.round(x * 100);           // 0.01점 단위 정수
    const conv = (s, f) => round(s * f, 2);
    // 현재 총점 순서(동점이면 연번 순)
    const ord = C.list.slice().sort((a, b) => b.total - a.total || a.idx - b.idx);
    const info = ord.map((o, r) => {
      const tg = grade(round(table(r + 1, N), 2));                 // ⑧ 기준 등급
      const gpB = grade(o.gpP.auto.reduce((s, v) => s + v, 0)), gqB = grade(o.gpQ.auto.reduce((s, v) => s + v, 0));
      const [pl, ph] = BAND[gpB], [ql, qh] = BAND[gqB];
      let [tl, th] = BAND[tg];
      const d = o.person.discipline;
      if (d === '징계' && (tg === '수' || tg === '우')) res.fail.push(`${o.name}: 징계자는 '우' 이상 불가인데 순위상 '${tg}' 자리입니다. 교감·교장 순위를 낮추세요.`);
      if (d === '불문경고' && tg === '수') res.fail.push(`${o.name}: 불문경고자는 '수' 불가인데 순위상 '수' 자리입니다. 교감·교장 순위를 낮추세요.`);
      const minT = round(conv(pl, 0.2) + conv(ql, 0.4) + o.dmTotal, 2), maxT = round(conv(ph, 0.2) + conv(qh, 0.4) + o.dmTotal, 2);

    if (res.fail.length) return res;
    // 순서가 정해진 목록에 대해 엄격한 내림차순 목표 총점 계산(위→아래 상한, 아래→위 하한)
    const solve = arr => {
      const U = [], L = [];
      arr.forEach((x, i) => { U[i] = Math.min(x.hi, i ? U[i - 1] - 1 : Infinity); });
      for (let i = arr.length - 1; i >= 0; i--) L[i] = Math.max(arr[i].lo, i < arr.length - 1 ? L[i + 1] + 1 : -Infinity);
      if (arr.some((x, i) => L[i] > U[i])) return null;
      let prev = Infinity; return arr.map((x, i) => { const T = Math.min(Math.max(x.cur, L[i]), U[i], prev - 1); prev = T; return T; });
    };
    let targets = solve(info);
    let order = info;
    if (!targets) {
      // 2단계: 순위를 그대로 둘 수 없으면, 등급 자리(수 b0명·우 b1명·미 나머지)에 들어갈 수 있는 교사를 현재 총점 순으로 배정
      const bj = baejeong(N); const slots = [['수', bj[0]], ['우', bj[1]], ['미', bj[2] + bj[3]]];
      const feas = (x, gname) => { const [tl, th] = BAND[gname]; const lo = Math.max(c100(tl), x.minC), hi = Math.min(c100(th), x.maxC); return lo <= hi ? [lo, hi] : null; };
      info.forEach(x => { x.minC = c100(round(conv(x.pl, 0.2) + conv(x.ql, 0.4) + x.o.dmTotal, 2)); x.maxC = c100(round(conv(x.ph, 0.2) + conv(x.qh, 0.4) + x.o.dmTotal, 2)); });
      let rest = info.slice(); const groups = [];
      for (const [gname, cnt] of slots) {
        const cand = rest.filter(x => feas(x, gname) && !(gname !== '미' && x.o.person.discipline === '징계') && !(gname === '수' && x.o.person.discipline === '불문경고'));
        // 아래 등급에 들어갈 수 없는 교사(최저점이 이 등급 하한 이상)를 먼저 배정
        cand.sort((a, b) => (b.minC >= c100(BAND[gname][0]) ? 1 : 0) - (a.minC >= c100(BAND[gname][0]) ? 1 : 0) || b.cur - a.cur);
        const pick = cand.slice(0, cnt);
        if (pick.length < cnt) { res.fail.push(`'${gname}' 등급 자리 ${cnt}명을 채울 수 있는 교사가 부족합니다. 교감·교장 순위를 조정하세요.`); return res; }
        groups.push(pick.map(x => { const [lo, hi] = feas(x, gname); return Object.assign({}, x, { lo, hi, tg: gname }); }).sort((a, b) => b.cur - a.cur));
        rest = rest.filter(x => !pick.includes(x));
      }
      targets = []; order = [];
      for (const gr of groups) {
        let t = solve(gr); let arr = gr;
        if (!t) { arr = gr.slice().sort((a, b) => b.hi - a.hi || b.cur - a.cur); t = solve(arr); }
        if (!t) { res.fail.push(`'${arr[0].tg}' 등급 안에서 동점 없이 점수를 정할 수 없습니다. 교감·교장 순위를 조정하세요.`); return res; }
        order = order.concat(arr); targets = targets.concat(t);

    }
    if (order !== info) { const tmp = order.slice(); info.length = 0; tmp.forEach(x => info.push(x)); }
    info.forEach((x, i) => {
      const T = targets[i];
      const o = x.o;
      if (T === x.cur) return;
      // T = conv(P,0.2)+conv(Q,0.4)+dm 를 만족하는 P,Q 중 현재와 가장 가까운 값
      const need = T - c100(o.dmTotal);
      const P0 = c100(o.gpP.score), Q0 = c100(o.gpQ.score);
      let best = null;
      for (let P = c100(x.pl); P <= c100(x.ph); P++) {
        const qc = need - c100(conv(P / 100, 0.2));               // 필요한 확인자 환산점(0.01 단위)
        const qBase = Math.round(qc / 0.4);
        for (let Q = qBase - 2; Q <= qBase + 2; Q++) {
          if (Q < c100(x.ql) || Q > c100(x.qh)) continue;

          const cost = Math.abs(P - P0) * 2 + Math.abs(Q - Q0) * 4 + (P !== P0 && Q !== Q0 ? 1 : 0);   // 총점 영향이 작고, 한 사람(평정자 또는 확인자)만 바꾸는 쪽 우선
          if (!best || cost < best.cost) best = { P, Q, cost };
        }
      }
      if (!best) { res.fail.push(`${o.name}: 목표 총점 ${T / 100}점을 만드는 평정자·확인자 점수를 찾지 못했습니다.`); return; }
      const spread = (el, auto, target) => {
        const out = el.slice(); let diff = round(target - out.reduce((s, v) => s + v, 0), 2);
        for (const k of [1, 2, 4, 0, 3]) { if (!diff) break; const max = GP_F[k] * 100; const nv = Math.min(max, Math.max(0, round(out[k] + diff, 2))); diff = round(diff - (nv - out[k]), 2); out[k] = nv; }
        return out.map((v, k) => v === auto[k] ? null : v);

      res.ov[o.id] = { p: spread(o.gpP.el, o.gpP.auto, best.P / 100), q: spread(o.gpQ.el, o.gpQ.auto, best.Q / 100) };
      res.changes.push({ id: o.id, name: o.name, rank: i + 1, oldRank: o.totalRank, grade: x.tg, p: [o.gpP.score, best.P / 100], q: [o.gpQ.score, best.Q / 100], total: [o.total, T / 100] });
    });

    info.forEach(x => {

      const okP = o.gpP.score >= x.pl && o.gpP.score <= x.ph, okQ = o.gpQ.score >= x.ql && o.gpQ.score <= x.qh;

 1];\n  }\n  function baejeong(N) { return N >= 1 && N <= 100 ? BJ[N - 1].slice() : null; }\n  function grade(s) { if (s == null || s === '' || isNaN(s)) return ''; s = clean(s); return s >= 95 ? '수' : s >= 90 ? '우' : s >= 85 ? '미' : '양'; }\n  /** 승진규정 제28조의4: 평가대상자 수별 최소 다면평가자 수 */\n  function minEvaluators(N) { return N <= 15 ? 3 : N <= 20 ? 4 : N <= 25 ? 5 : N <= 30 ? 6 : N <= 35 ? 7 : 8; }\n\n  // 정성평가 요소: [이름, 배점, 조견표점수에 곱하는 계수]  (학습지도는 총점-나머지)\n  const QUAL = [\n    { key: 'att', name: '교육공무원으로서의 태도', short: '태도', max: 10, f: 0.1 },\n    { key: 'learn', name: '학습지도', short: '학습지도', max: 40, f: null },\n    { key: 'life', name: '생활지도', short: '생활지도', max: 30, f: 0.3 },\n    { key: 'pro', name: '전문성개발', short: '전문성개발', max: 5, f: 0.05 },\n    { key: 'duty', name: '담당업무', short: '담당업무', max: 15, f: 0.15 }\n  ];\n  const QUANT = [\n    { key: 'learn', name: '학습지도', max: 30 },\n    { key: 'life', name: '생활지도', max: 30 },\n    { key: 'pro', name: '전문성개발', max: 10 },\n    { key: 'duty', name: '담당업무', max: 30 }\n  ];\n  // 근무성적평정 요소 계수(평정점 100점 기준)\n  const GP_F = [0.1, 0.4, 0.3, 0.05, 0.15];\n\n  /** [서식1] 다면평가자 1명이 매긴 한 사람의 요소별 점수 — 평가자평가표 C~H열 */\n  function qualFromScore(t) {\n    if (t == null || t === '' || isNaN(t)) return null;\n    const total = round(t, 2);\n    const att = round(t / 10, 2), life = round(t / 10 * 3, 2), pro = round(t / 10 * 0.5, 2), duty = round(t / 10 * 1.5, 2);\n    const learn = round(total - att - life - pro - duty, 2);\n    return { el: [att, learn, life, pro, duty], total };\n  }\n\n  function targets(st) { return st.people.filter(p => p.target && p.name); }\n  function evaluators(st) { return st.people.filter(p => p.evaluator && p.name); }\n\n  /** 다면평가자 한 명이 평가해야 할 대상자(본인 제외)와 실평가대상자 수 */\n  function evalScope(st, evId) {\n    const list = targets(st).filter(p => p.id !== evId);\n    return { list, N: list.length };\n  }\n\n  /** 다면평가자 한 명의 서식1 행 */\n  function qualSheet(st, evId) {\n    const { list, N } = evalScope(st, evId);\n    const q = (st.qual && st.qual[evId]) || {};\n    const direct = q.mode === 'score';\n    const rows = list.map(p => {\n      let rank = q.ranks ? q.ranks[p.id] : null;\n      rank = rank === '' || rank == null ? null : Number(rank);\n      let raw = null;\n      if (direct) { const s = q.scores ? q.scores[p.id] : null; raw = s === '' || s == null ? null : Number(s); }\n      else if (rank) raw = table(rank, N);\n      const r = qualFromScore(raw);\n      return { id: p.id, name: p.name, rank, raw, el: r ? r.el : null, total: r ? r.total : null };\n    });\n    // 점검\n    const issues = [];\n    if (!direct) {\n      const seen = {};\n      rows.forEach(r => { if (r.rank) seen[r.rank] = (seen[r.rank] || 0) + 1; });\n      rows.forEach(r => {\n        r.dup = r.rank && seen[r.rank] > 1;\n        r.bad = r.rank != null && (!(r.rank >= 1 && r.rank <= N) || !Number.isInteger(r.rank));\n      });\n      const missing = []; for (let k = 1; k <= N; k++) if (!seen[k]) missing.push(k);\n      if (rows.some(r => r.rank == null)) issues.push('순위를 입력하지 않은 대상자가 있습니다.');\n      if (rows.some(r => r.dup)) issues.push('중복된 순위가 있습니다.');\n      if (rows.some(r => r.bad)) issues.push(`순위는 1~${N} 사이의 정수여야 합니다.`);\n      if (!issues.length && missing.length) issues.push('누락된 순위: ' + missing.join(', '));\n    } else {\n      rows.forEach(r => { r.bad = r.raw != null && (r.raw < 85 || r.raw > 100); });\n      if (rows.some(r => r.raw == null)) issues.push('점수를 입력하지 않은 대상자가 있습니다.');\n      if (rows.some(r => r.bad)) issues.push('직접 입력 점수는 85~100점 범위여야 합니다.');\n      const tot = rows.filter(r => r.total != null).map(r => r.total);\n      if (new Set(tot).size !== tot.length) issues.push('동점이 있습니다(특별한 사정이 없으면 동점을 주지 않음).');\n    }\n    rows.forEach(r => { if (r.el && r.el[1] > 40) issues.push(`${r.name}: 학습지도 점수가 40점을 넘습니다.`); });\n    const complete = rows.length > 0 && rows.every(r => r.total != null) && !issues.length;\n    return { N, rows, issues, complete, direct };\n  }\n\n  /** [서식1-1] 요소별 집계: 최고·최저 제외(평가자 4인 이상), 평균 */\n  function aggregate(vals) {\n    const v = vals.filter(x => x != null);\n    const cnt = v.length;\n    if (!cnt) return { cnt, sum: null, avg: null, max: null, min: null };\n    const s = add(...v), mx = Math.max(...v), mn = Math.min(...v);\n    const sum = cnt < 4 ? s : add(s, -mx, -mn);\n    const avg = cnt < 4 ? round(sum / cnt, 2) : round(sum / (cnt - 2), 2);\n    return { cnt, sum, avg, max: mx, min: mn, dropped: cnt >= 4 };\n  }\n\n  function rates(st, mode) {\n    if (mode === 'perf') return { qual: Number(st.perfRate?.qual ?? 20), quant: Number(st.perfRate?.quant ?? 80) };\n    return { qual: 32, quant: 8 };\n  }\n\n  /** 전체 계산 */\n  function compute(st, mode = 'promo') {\n    const T = targets(st), E = evaluators(st);\n    const N = T.length;\n    const R = rates(st, mode);\n    const sheets = {}; E.forEach(e => { sheets[e.id] = qualSheet(st, e.id); });\n    const byId = {};\n    T.forEach((p, i) => {\n      const o = { id: p.id, idx: i + 1, name: p.name, person: p };\n      // 정성: 요소별 다면평가자 점수\n      o.qualBy = E.map(e => { const r = sheets[e.id].rows.find(x => x.id === p.id); return r && r.el ? r.el : null; });\n      o.qualAgg = QUAL.map((q, k) => aggregate(o.qualBy.map(el => el ? el[k] : null)));\n      const qAvgs = o.qualAgg.map(a => a.avg);\n      o.qualEl = qAvgs;\n      o.qualTotal = qAvgs.every(v => v != null) ? add(...qAvgs) : null;\n      o.qualConv = o.qualTotal != null ? round(o.qualTotal * R.qual / 100, 2) : null;\n      // 정량\n      const qn = (st.quant && st.quant[p.id]) || [];\n      o.quantEl = QUANT.map((q, k) => (qn[k] === '' || qn[k] == null) ? null : Number(qn[k]));\n      o.quantTotal = o.quantEl.every(v => v != null) ? add(...o.quantEl) : null;\n      o.quantConv = o.quantTotal != null ? round(o.quantTotal * R.quant / 100, 2) : null;\n      // 다면 합산\n      o.dmTotal = (o.qualConv != null && o.quantConv != null) ? add(o.qualConv, o.quantConv) : null;\n      // 근무성적평정\n      const g = (st.gp && st.gp[p.id]) || {};\n      const mk = (who) => {\n        const rk = g[who] === '' || g[who] == null ? null : Number(g[who]);\n        const base = rk ? table(rk, N) : null;\n        const auto = GP_F.map(f => base == null ? null : rounddown(base * f, 2));\n        const ov = (g.ov && g.ov[who]) || [];\n        const el = auto.map((v, k) => (ov[k] === '' || ov[k] == null) ? v : Number(ov[k]));\n        const score = el.every(v => v != null) ? add(...el) : null;\n        const conv = score == null ? null : round(score * (who === 'p' ? 0.2 : 0.4), 2);\n        return { rank: rk, base, auto, el, manual: ov.some(v => v !== '' && v != null), score, conv };\n      };\n      o.gpP = mk('p'); o.gpQ = mk('q');\n      o.gpTotal = (o.gpP.conv != null && o.gpQ.conv != null) ? add(o.gpP.conv, o.gpQ.conv) : null;\n      o.total = (o.gpTotal != null && o.dmTotal != null) ? add(o.gpP.conv, o.gpQ.conv, o.dmTotal) : null;\n      byId[p.id] = o;\n    });\n    const list = T.map(p => byId[p.id]);\n    // 순위 (엑셀 RANK: 내림차순, 동점은 같은 순위)\n    const rk = (key) => { const vals = list.map(o => o[key]).filter(v => v != null); list.forEach(o => { o[key + 'Rank'] = o[key] == null ? null : 1 + vals.filter(v => v > o[key]).length; }); };\n    rk('total'); rk('dmTotal'); rk('qualTotal'); rk('quantTotal'); rk('gpTotal');\n    list.forEach(o => {\n      // ⑧ 조정점(참고값: 실제 조정점은 교육지원청 작성). 엑셀 조견표의 부동소수 오차(예: 30명 21위 89.996)로\n      //    배정표와 어긋나는 일이 없도록 소수 둘째 자리로 반올림해 등급을 판정\n      o.adj = o.totalRank ? round(table(o.totalRank, N), 2) : null;\n      o.gradeAdj = grade(o.adj);\n      o.gradeTotal = grade(o.total);\n      o.gradeP = grade(o.gpP.score); o.gradeQ = grade(o.gpQ.score);\n    });\n    return { N, list, byId, sheets, E, T, R, mode, checks: checks(st, list, N, E, sheets) };\n  }\n\n  function countGrades(arr) {\n    const c = { 수: 0, 우: 0, 미: 0, 양: 0 };\n    arr.forEach(g => { if (c[g] != null) c[g]++; });\n    return c;\n  }\n  /** 배정표와 비교(양은 미에 포함 가능) */\n  function distOK(c, N) {\n    const b = baejeong(N); if (!b) return false;\n    return c.수 === b[0] && c.우 === b[1] && (c.미 + c.양) === (b[2] + b[3]);\n  }\n\n  function checks(st, list, N, E, sheets) {\n    const out = { errors: [], warns: [], gp: {} };\n    if (N === 0) { out.errors.push('평가대상자가 없습니다.'); return out; }\n    if (N > 100) out.errors.push('평가대상자는 100명까지 처리할 수 있습니다.');\n    const need = minEvaluators(N);\n    if (E.length < need) out.errors.push(`평가대상자 ${N}명에는 다면평가자가 ${need}명 이상 필요합니다(현재 ${E.length}명).`);\n    // 순위 중복·누락 (평정자/확인자)\n    ['p', 'q'].forEach(w => {\n      const label = w === 'p' ? '평정자(교감)' : '확인자(교장)';\n      const rs = list.map(o => (w === 'p' ? o.gpP : o.gpQ).rank);\n      const seen = {}; rs.forEach(r => { if (r) seen[r] = (seen[r] || 0) + 1; });\n      const dup = Object.keys(seen).filter(k => seen[k] > 1);\n      const miss = []; for (let k = 1; k <= N; k++) if (!seen[k]) miss.push(k);\n      out.gp[w] = { dup: dup.map(Number), miss };\n      if (rs.some(r => r == null)) out.warns.push(`${label} 순위가 입력되지 않은 교사가 있습니다.`);\n      else {\n        if (dup.length) out.errors.push(`${label} 순위 중복: ${dup.join(', ')}`);\n        if (miss.length) out.errors.push(`${label} 순위 누락: ${miss.join(', ')}`);\n      }\n    });\n    const done = list.every(o => o.total != null);\n    out.done = done;\n    if (done) {\n      const cT = countGrades(list.map(o => o.gradeTotal));\n      const cA = countGrades(list.map(o => o.gradeAdj));\n      const cP = countGrades(list.map(o => o.gradeP));\n      const cQ = countGrades(list.map(o => o.gradeQ));\n      out.dist = { total: cT, adj: cA, p: cP, q: cQ, bj: baejeong(N) };\n      out.mismatch = list.filter(o => o.gradeTotal !== o.gradeAdj).map(o => o.id);\n      if (out.mismatch.length) out.errors.push('⑦총점 기준 등급과 ⑧조정점 기준 등급이 일치하지 않습니다(평정분포 비율 불일치).');\n      if (!distOK(cP, N)) out.errors.push('평정자(교감) 평정점의 수·우·미 분포가 배정표와 다릅니다.');\n      if (!distOK(cQ, N)) out.errors.push('확인자(교장) 평정점의 수·우·미 분포가 배정표와 다릅니다.');\n      const tots = list.map(o => o.total);\n      const ties = list.filter(o => tots.filter(t => t === o.total).length > 1).map(o => o.name);\n      if (ties.length) out.errors.push('합산 총점 동점자: ' + [...new Set(ties)].join(', ') + ' (합산점은 동일하지 않도록 해야 함)');\n      list.forEach(o => {\n        const d = o.person.discipline;\n        if (d === '징계' && ['수', '우'].includes(o.gradeTotal)) out.errors.push(`${o.name}: 징계(견책 이상)자는 '우' 이상 평정 불가`);\n        if (d === '불문경고' && o.gradeTotal === '수') out.errors.push(`${o.name}: 불문경고자는 '수' 평정 불가`);\n        [o.gpP, o.gpQ].forEach((g, k) => {\n          if (g.score > 100) out.errors.push(`${o.name}: ${k ? '확인자' : '평정자'} 평정점이 100점을 넘습니다.`);\n          g.el.forEach((v, j) => { if (v > GP_F[j] * 100 + 1e-9) out.errors.push(`${o.name}: ${k ? '확인자' : '평정자'} ${QUAL[j].short} 점수가 배점(${GP_F[j] * 100})을 넘습니다.`); });\n        });\n        if (o.gpTotal > 60) out.errors.push(`${o.name}: 근무성적평정 총점이 60점을 넘습니다.`);\n      });\n      if (list.some(o => o.gradeTotal === '양')) out.warns.push(\"'양' 평정자가 있습니다. 징계 등 사유가 있는 경우에만 부여하며 교육지원청 인사담당과 협의가 필요합니다.\");\n    }\n    return out;\n  }\n\n  /** 수동조정 도우미: 등급이 어긋난 교사에 대해 현재 등급을 유지하면서 깎을 수 있는 폭 */\n  function adjustHint(o) {\n    const lo = s => s >= 95 ? 95 : s >= 90 ? 90 : s >= 85 ? 85 : 0;\n    const res = {};\n    if (o.total == null) return null;\n    const target = o.gradeAdj; // 맞춰야 할 등급\n    const band = { 수: [95, 100], 우: [90, 94.99], 미: [85, 89.99], 양: [0, 84.99] }[target];\n    res.target = target; res.band = band;\n    res.need = o.total > band[1] ? round(o.total - band[1], 2) : o.total < band[0] ? round(o.total - band[0], 2) : 0;\n    res.pRoom = o.gpP.score != null ? round(o.gpP.score - lo(o.gpP.score), 2) : null; // 평정점 기준 등급 유지 가능한 감점 폭\n    res.qRoom = o.gpQ.score != null ? round(o.gpQ.score - lo(o.gpQ.score), 2) : null;\n    const hi = s => s >= 95 ? 100 : s >= 90 ? 94.99 : s >= 85 ? 89.99 : 84.99;\n    res.pUp = o.gpP.score != null ? round(hi(o.gpP.score) - o.gpP.score, 2) : null; // 등급 유지하며 올릴 수 있는 폭\n    res.qUp = o.g   const KINDS = ['교사', '수석교사', '보건교사', '영양교사', '사서교사', '전문상담교사', '특수교사', '기간제교사'];
  function rosterProblems() {
    const errors = [], warns = [];
    const names = S.people.filter(p => p.name).map(p => p.name.trim());
    const dup = names.filter((n, k) => names.indexOf(n) !== k);
    if (dup.length) errors.push(`동명이인(또는 중복 입력): ${[...new Set(dup)].join(', ')} — 이름 뒤에 구분 표시를 붙이세요. 예: 홍길동(1담임)`);
    S.people.forEach(p => {
      if (!p.name) return;
      if (p.kind === '수석교사' && p.target) errors.push(`${p.name}: 수석교사는 다면평가 대상자가 아닙니다(다면평가자는 가능).`);
      if (p.kind === '기간제교사' && p.evaluator) errors.push(`${p.name}: 계약제 교원(기간제교사 등)은 다면평가자에서 제외됩니다.`);
      if (isRegular() && p.kind === '기간제교사' && p.target) warns.push(`${p.name}: 기간제교사는 근무성적평정 대상이 아닙니다. 평가 구분을 ‘계약제 교원’으로 한 별도 작업 파일에서 평가하세요.`);
      if (!isRegular() && p.discipline) warns.push(`${p.name}: 징계 표시는 근무성적평정에서만 점검됩니다.`);
    });
    const nT = T().length, nE = E().length;
    if (nT && nE < DM.minEvaluators(nT)) errors.push(`평가대상자 ${nT}명 → 다면평가자 ${DM.minEvaluators(nT)}명 이상 필요(현재 ${nE}명)`);

    if (nE && E().every(e => e.target) && nT - 1 < 1) errors.push('다면평가자가 평가할 대상자가 없습니다.');
    return { errors, warns };
  }

  // ── 평가자용 독립 HTML 파일 ──
  function evalFile(evId) {
    const e = S.people.find(p => p.id === evId);
    const payload = {
      kind: 'dm-eval', ver: 1, school: S.info.school, year: S.info.year, from: S.info.from, to: S.info.to,
      evaluator: { id: e.id, name: e.name }, roster: T().map(p => ({ id: p.id, name: p.name })), key: rosterKey()
    };
    S.evalKeys[evId] = rosterKey(); save();
    const js = JSON.stringify(payload).replace(/</g, '\\u003c');
    return EVAL_TEMPLATE.replace('__PAYLOAD__', () => js);
  }
  function importEvalResults(files) {
    let ok = 0; const msgs = [];
    files.forEach(f => {
      let d; try { d = JSON.parse(f.text); } catch (e) { msgs.push(`${f.name}: 결과 파일 형식이 아닙니다.`); return; }
      if (!d || d.kind !== 'dm-eval-result') { msgs.push(`${f.name}: 다면평가 결과 파일이 아닙니다.`); return; }
      const ev = S.people.find(p => p.id === d.evaluator.id && p.evaluator);
      if (!ev) { msgs.push(`${f.name}: 평가자 ‘${d.evaluator.name}’를 현재 명단의 다면평가자에서 찾을 수 없습니다.`); return; }
      if (d.key !== rosterKey()) msgs.push(`${f.name}: 평가자용 파일을 만든 뒤 명단이 바뀌었습니다. 결과를 불러왔지만 반드시 확인하세요.`);
      S.qual[ev.id] = { mode: d.mode === 'score' ? 'score' : 'rank', ranks: d.ranks || {}, scores: d.scores || {}, src: `파일: ${f.name} (${d.savedAt ? new Date(d.savedAt).toLocaleString('ko-KR') : ''})` };
      ok++;
    });
    save(); render();
    showDialog('결과 파일 불러오기', `<p>${ok}개 파일을 불러왔습니다.</p>${msgs.length ? `<div class="msg warn"><ul style="margin:0 0 0 18px">${msgs.map(m => `<li>${esc(m)}</li>`).join('')}</ul></div>` : ''}`);
  }

      }).join('')}</tbody></table></div>

    ${nav('result', 'print')}`;

        각 요소는 배점(10·40·30·5·15)을 넘을 수 없고, 평정자·확인자 각각의 수·우·미 분포가 배정표와 맞아야 하므로 아래 안내 범위 안에서 조정하세요.</div>

  /** 목표 평정점에 맞춰 요소 점수 조정: 학습지도 → 생활지도 → 담당업무 → 태도 → 전문성개발 순서로 배점 범위 안에서 차이를 흡수 */
  function applyTarget(id, w, target) {
    const C = DM.compute(S); const o = C.byId[id]; const gp = w === 'p' ? o.gpP : o.gpQ;
    if (gp.score == null) return toast('먼저 순위를 입력하세요.');
    if (!(target > 0 && target <= 100)) return toast('목표 평정점은 0~100 사이로 입력하세요.');
    const el = gp.el.slice(); let diff = DM.round(target - gp.score, 2);
    for (const k of [1, 2, 4, 0, 3]) {
      if (!diff) break;
      const max = DM.GP_F[k] * 100;
      const nv = Math.min(max, Math.max(0, DM.round(el[k] + diff, 2)));
      diff = DM.round(diff - (nv - el[k]), 2); el[k] = nv;

  function sample35(seed){
    let x=seed>>>0; const rnd=()=>{x^=x<<13;x>>>=0;x^=x>>>17;x^=x<<5;x>>>=0;return x/4294967296;};
    const names=['김민준','이서연','박지훈','최수빈','정예은','강도윤','조하은','윤시우','장지민','임서준','한유진','오승현','서지아','신동현','권나연','황준서','안소율','송민재','전하린','홍재원','유채원','고태윤','문수아','양현우','손다은','배지호','백서윤','허건우','남지유','심우진','노예린','하은호','곽서아','성민혁','차윤서'];
    const kinds={8:'보건교사',17:'영양교사',26:'특수교사',31:'전문상담교사'};
    const evIdx=[2,7,12,16,21,27,33];
    const lat=names.map(()=>rnd());
    const s=blankState(); Object.assign(s.info,{school:'한빛초등학교',vpName:'김교감',prName:'이교장',dirName:'박과장'});
    names.forEach((n,i)=>{const id='sy'+String(i).padStart(2,'0');
      s.people.push({id,name:n,birth:String(650101+Math.floor(rnd()*300000)).slice(0,6),kind:kinds[i]||'교사',target:true,evaluator:evIdx.includes(i),discipline:'',note:''});
      const q=lat[i]; const sec=[30,30,10,30].map(m=>Math.max(Math.round(m*0.7),Math.min(m,Math.round(m*(0.8+0.2*q)+(rnd()*2-1)*m/30*1.5))));
      s.quant[id]=sec;});
    const ids=s.people.map(p=>p.id);
    evIdx.forEach(e=>{const ev=ids[e]; const others=ids.filter(v=>v!==ev);
      const sc=others.map(o=>({o,v:lat[ids.indexOf(o)]+ (rnd()-0.5)*0.18})).sort((a,b)=>b.v-a.v);
      const r={}; sc.forEach((z,k)=>r[z.o]=k+1); s.qual[ev]={mode:'rank',ranks:r,src:'연습 자료(35명)'};});
    const mk=(noise)=>{const sc=ids.map(o=>({o,v:lat[ids.indexOf(o)]+(rnd()-0.5)*noise})).sort((a,b)=>b.v-a.v);const r={};sc.forEach((z,k)=>r[z.o]=k+1);return r;};
    const P=mk(0.1),Q=mk(0.1); ids.forEach(o=>s.gp[o]={p:P[o],q:Q[o]});
    return s;
  }

    if (ds.tgtapply) { const [id, w] = ds.tgtapply.split(':'); const inp = $(`[data-tgt="${ds.tgtapply}"]`); applyTarget(id, w, Number(inp && inp.value)); return; }
    if (ds.ovclear) { if (S.gp[ds.ovclear]) delete S.gp[ds.ovclear].ov; save(); render(); return; }
    if (ds.selgrp) { const g = DOCS()[+ds.selgrp]; g.items.forEach(i => { if (!ui.printSel.includes(i.id)) ui.printSel.push(i.id); }); render(); return; }
    const a = ds.act;
    if (a === 'backup') { download(`다면평가_작업파일_${S.info.school || '학교'}_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(S, null, 1)); toast('작업 파일을 저장했습니다.'); }
    else if (a === 'restore') pickFiles('.json,application/json', false, fs => { try { const d = JSON.parse(fs[0].text); if (d.v !== 1 || !Array.isArray(d.people)) throw 0; if (!confirm('현재 자료를 불러온 작업 파일로 바꿀까요?')) return; S = Object.assign(blankState(), d); save(); render(); toast('작업 파일을 불러왔습니다.'); } catch (e) { alert('작업 파일 형식이 아닙니다. (평가자 결과 파일은 [정성평가] 단계에서 불러오세요.)'); } });
    else if (a === 'wipe') { if (confirm('이 PC 브라우저에 저장된 모든 자료를 지웁니다. 계속할까요?')) { localStorage.removeItem(KEY); S = blankState(); render(); } }
    else if (a === 'sample35') { if (confirm('연습 자료를 불러오면 현재 자료가 바뀝니다. 계속할까요?')) { S = sample35(3); save(); go('roster'); toast('연습 자료(교원 35명)를 불러왔습니다.'); } }
    else if (a === 'addRow') { S.people.push({ id: uid(), name: '', birth: '', kind: '교사', target: true, evaluator: false, discipline: '', note: '' }); save(); render(); setTimeout(() => { const ins = $$('input[data-k="name"]'); ins[ins.length - 1]?.focus(); }, 0); }
    else if (a === 'pasteRoster') showDialog('엑셀에서 붙여넣기', `<p class="note" style="margin-top:0">엑셀의 [성명, 생년월일, (다면평가자 여부: ○ 또는 Y)] 열을 복사해 붙여넣으세요. 한 줄에 한 명입니다.</p><textarea id="pasteBox" rows="12" style="width:100%" placeholder="김민준	650101	○&#10;이서연	700315"></textarea><label class="row note" style="margin-top:6px"><input type="checkbox" id="pasteReplace"> 기존 명단을 지우고 바꾸기</label>`, `<button class="btn" data-dlgclose>취소</button><button class="btn pri" data-act="pasteDo">추가</button>`);
    else if (a === 'pasteDo') {
      const lines = $('#pasteBox').value.split(/\r?\n/).map(l => l.split('\t').map(x => x.trim())).filter(c => c[0]);
      if ($('#pasteReplace').checked) { S.people = []; S.qual = {}; S.quant = {}; S.gp = {}; }
      lines.forEach(c => S.people.push({ id: uid(), name: c[0], birth: c[1] || '', kind: '교사', target: true, evaluator: /^(o|○|y|yes|예|v|✓|1|다면)/i.test(c[2] || ''), discipline: '', note: '' }));
      $('#dlg').close(); save(); render(); toast(`${lines.length}명을 추가했습니다.`);
    }
    else if (a === 'resetCriteria') { if (confirm('정량평가 세부기준을 엑셀 프로그램의 예시로 되돌릴까요?')) { S.criteria = DEFAULT_CRITERIA(); save(); render(); } }
    else if (a === 'makeAllEval') { const C = DM.compute(S); C.E.forEach((e, k) => setTimeout(() => download(`정성평가_${e.name}.html`, evalFile(e.id), 'text/html'), k * 400)); toast(`${C.E.length}개 평가자용 파일을 저장합니다(브라우저가 여러 파일 다운로드 허용을 물으면 ‘허용’).`); setTimeout(render, C.E.length * 400 + 100); }
    else if (a === 'importEval') pickFiles('.json,application/json', true, importEvalResults);
    else if (a === 'seedRanks') {
      const C = DM.compute(S); if (C.list.some(o => o.dmTotal == null)) return toast('다면평가 점수가 모두 있어야 합니다.');
      if (Object.values(S.gp).some(g => g.p || g.q) && !confirm('입력된 교감·교장 순위를 다면평가 순위로 바꿀까요?')) return;
      const ord = C.list.slice().sort((a, b) => b.dmTotal - a.dmTotal || a.idx - b.idx);
      ord.forEach((o, k) => { S.gp[o.id] = Object.assign(S.gp[o.id] || {}, { p: k + 1, q: k + 1 }); }); save(); render();
    }
    else if (a === 'autoAdj') {
      const C = DM.compute(S);
      if (C.checks.done && !C.checks.errors.length) return toast('이미 모든 점검을 통과했습니다. 바꿀 점수가 없습니다.');
      const r = DM.autoAdjust(S); ui.autoPlan = r;
      if (!r.ok) return showDialog('평정분포 자동 맞추기 — 맞출 수 없음', `<div class="msg err"><ul style="margin:0 0 0 18px">${r.fail.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
        <p class="note">평정자·확인자 평정점은 각자의 순위에 따른 등급(수·우·미) 범위 안에서만 바꿀 수 있습니다(평정자·확인자 분포를 지키기 위함). 그 범위로 맞출 수 없으면 교감·교장 순위부터 조정해야 합니다. 예: ‘수’ 자리가 모자라면 다면평가 점수가 높은 교사의 교감·교장 순위를 함께 올립니다. [다면평가 순위로 교감·교장 순위 채우기]로 시작한 뒤 조정하면 대부분 맞출 수 있습니다.</p>`);
      if (!r.changes.length) return toast('바꿀 점수가 없습니다.');
      const cell = (a2) => `${f2(a2[0])} → <b>${f2(a2[1])}</b>`;
      showDialog('평정분포 자동 맞추기 — 변경 내용 확인', `
        <p style="margin-top:0">⑦총점 기준과 ⑧조정점 기준 등급이 일치하고, 평정자·확인자 분포가 배정표와 같으며, 총점 동점이 없도록 <b>${r.changes.length}명</b>의 요소 점수를 바꿉니다. 평정자·확인자 평정점은 각자 순위의 등급 범위 안에서만 움직이며, 바뀐 차이는 학습지도(모자라면 생활지도·담당업무) 점수에 반영됩니다.</p>
        ${r.reordered ? '<div class="msg warn">현재 순위 그대로는 맞출 수 없어 일부 교사의 ⑨순위가 바뀝니다(아래 ‘순위’ 열 확인).</div>' : '<div class="msg ok">⑨순위는 바뀌지 않습니다.</div>'}
        <table class="t"><thead><tr><th>성명</th><th>순위</th><th>맞출 등급</th><th>평정자 평정점</th><th>확인자 평정점</th><th>⑦ 총점</th></tr></thead><tbody>
        ${r.changes.map(c => `<tr><td class="l">${esc(c.name)}</td><td>${c.oldRank === c.rank ? c.rank : `${c.oldRank} → <b>${c.rank}</b>`}</td><td class="${gcls(c.grade)}">${c.grade}</td><td class="r">${cell(c.p)}</td><td class="r">${cell(c.q)}</td><td class="r">${cell(c.total)}</td></tr>`).join('')}
        </tbody></table><p class="note">적용 후에도 [자동 맞추기 되돌리기]로 이전 상태로 돌아갈 수 있습니다. 자동 결과는 하나의 제안이므로 교감·교장의 평정 의도에 맞는지 검토하세요.</p>`,
        `<button class="btn" data-dlgclose>취소</button><button class="btn pri" data-act="autoApply">적용</button>`);
    }
    else if (a === 'autoApply') {
      const r = ui.autoPlan; if (!r) return;
      ui.undoGp = JSON.parse(JSON.stringify(S.gp));
      Object.entries(r.ov).forEach(([id, ov]) => { const g = S.gp[id] || (S.gp[id] = {}); g.ov = ov; });
      ui.autoPlan = null; $('#dlg').close(); save(); render();
      const C = DM.compute(S); toast(C.checks.errors.length ? '적용했지만 남은 점검 항목이 있습니다. 확인하세요.' : `${r.changes.length}명의 점수를 조정했습니다. 모든 점검 통과.`);
    }
    else if (a === 'undoAuto') { if (ui.undoGp && confirm('자동 맞추기 이전 상태로 되돌릴까요?')) { S.gp = ui.undoGp; ui.undoGp = null; save(); render(); toast('되돌렸습니다.'); } }
    else if (a === 'clearRanks') { if (confirm('교감·교장 순위와 수동조정을 모두 지울까요?')) { S.gp = {}; save(); render(); } }
    else if (a === 'selNone') { ui.printSel = []; render(); }
    else if (a === 'preview') { $('#preview').innerHTML = ui.printSel.length ? buildDocs(ui.printSel) : ''; }
    else if (a === 'doPrint') { if (!ui.printSel.length) return toast('출력할 서식을 선택하세요.'); $('#preview').innerHTML = buildDocs(ui.printSel); setTimeout(() => window.print(), 100); }
  });

  document.addEventListener('change', ev => {
    const t = ev.target; const ds = t.dataset;
    if (ds.sel) { if (t.checked) { if (!ui.printSel.includes(ds.sel)) ui.printSel.push(ds.sel); } else ui.printSel = ui.printSel.filter(x => x !== ds.sel); return; }
    if (ds.p && (t.type === 'checkbox' || t.tagName === 'SELECT')) { const p = S.people.find(x => x.id === ds.p); p[ds.k] = t.type === 'checkbox' ? t.checked : t.value; save(); render(); return; }
    if (ds.info && t.tagName === 'SELECT') { S.info[ds.info] = t.value; save(); render(); return; }
    if (ds.qmode) { const q = S.qual[ds.qmode] || (S.qual[ds.qmode] = {}); q.mode = t.checked ? 'score' : 'rank'; q.ranks = q.ranks || {}; q.scores = q.scores || {}; save(); render(); return; }
  });

  // 입력 중에는 값만 반영하고, 포커스가 빠질 때 다시 그림(커서 유지)
  let dirty = false;
  document.addEventListener('input', ev => {
    const t = ev.target; const ds = t.dataset; dirty = true;
    if (ds.info) { S.info[ds.info] = t.value; save(); return; }
    if (ds.rate) { S.perfRate[ds.rate] = t.value; save(); return; }
    if (ds.p && t.type !== 'checkbox' && t.tagName !== 'SELECT') { S.people.find(x => x.id === ds.p)[ds.k] = t.value; save(); return; }
    if (ds.cit) { const [a, b] = ds.cit.split('.').map(Number); S.criteria.sections[a].items[b].title = t.value; save(); return; }
    if (ds.clv) { const [a, b, c] = ds.clv.split('.').map(Number); S.criteria.sections[a].items[b].levels[c][ds.f] = ds.f === 's' ? t.value : t.value; save(); return; }
    if (ds.qr) { const [e, p] = ds.qr.split(':'); const q = S.qual[e] || (S.qual[e] = { mode: 'rank', ranks: {}, scores: {} }); q.ranks = q.ranks || {}; const v = t.value.trim(); if (v === '') delete q.ranks[p]; else q.ranks[p] = Number(v); q.src = '직접 입력'; save(); return; }
    if (ds.qs) { const [e, p] = ds.qs.split(':'); const q = S.qual[e]; q.scores = q.scores || {}; const v = t.value.trim(); if (v === '') delete q.scores[p]; else q.scores[p] = Number(v); q.src = '직접 입력'; save(); return; }
    if (ds.qn) { const [p, k] = ds.qn.split(':'); const a = S.quant[p] || (S.quant[p] = [null, null, null, null]); const v = t.value.trim(); a[+k] = v === '' ? null : Number(v); save(); return; }
    if (ds.gr) { const [p, w] = ds.gr.split(':'); const g = S.gp[p] || (S.gp[p] = {}); const v = t.value.trim(); g[w] = v === '' ? null : Number(v); save(); return; }
    if (ds.ov) { const [p, w, k] = ds.ov.split(':'); const g = S.gp[p] || (S.gp[p] = {}); g.ov = g.ov || {}; g.ov[w] = g.ov[w] || [null, null, null, null, null];
      const v = t.value.trim(); const o = DM.compute(S).byId[p]; const auto = (w === 'p' ? o.gpP : o.gpQ).auto[+k];
      g.ov[w][+k] = (v === '' || isNaN(v) || Number(v) === auto) ? null : Number(v); save(); return; }
  });
  const LIVE = ['qr', 'qs', 'qn', 'gr', 'ov', 'rate'];
  document.addEventListener('focusout', ev => {
    const t = ev.target; if (!t.dataset) return;
    const k = Object.keys(t.dataset).find(x => LIVE.includes(x) || x === 'p' || x === 'info' || x === 'cit' || x === 'clv');
    if (!k || !dirty) return;
    // 다음 칸으로 포커스가 옮겨진 뒤 다시 그리고, 그 칸에 포커스를 돌려줌
    setTimeout(() => {
      const a = document.activeElement; const sel = a && a.dataset ? Object.entries(a.dataset).map(([kk, v]) => `[data-${kk.replace(/[A-Z]/g, m => '-' + m.toLowerCase())}="${CSS.escape(v)}"]`).join('') : '';
      if (t.type === 'checkbox' || !dirty) return;
      dirty = false;
      render();
      if (sel) { const n = $(sel); if (n) { n.focus(); if (n.select) n.select(); } }
    }, 0);
  });
  document.addEventListener('keydown', ev => {
    if (ev.key !== 'Enter') return; const t = ev.target; if (t.tagName !== 'INPUT') return;
    if (t.dataset.tgt) { ev.preventDefault(); const [id, w] = t.dataset.tgt.split(':'); applyTarget(id, w, Number(t.value)); return; }
    const ds = t.dataset; if (!(ds.qr || ds.qs || ds.qn || ds.gr || ds.ov)) return;
    ev.preventDefault();
    const ins = $$('input.rk, input.num').filter(i => !i.disabled);
    const i = ins.indexOf(t);
    // 같은 열의 다음 행으로
    const attr = ds.qr ? 'qr' : ds.qs ? 'qs' : ds.qn ? 'qn' : ds.gr ? 'gr' : 'ov';
    const col = attr === 'qn' ? ds.qn.split(':')[1] : attr === 'gr' ? ds.gr.split(':')[1] : null;
    const same = ins.filter(x => x.dataset[attr] && (col == null || x.dataset[attr].split(':')[1] === col));
    const n = same[same.indexOf(t) + 1] || ins[i + 1];
    if (n) n.focus(); else t.blur();
  });
  window.addEventListener('beforeprint', () => { if (step === 'print' && ui.printSel.length) $('#preview').innerHTML = buildDocs(ui.printSel); });

  // 다른 탭에서 바뀐 경우 반영
  window.addEventListener('storage', e => { if (e.key === KEY) { S = load(); render(); } });

  render();
})();

</script>
</body>
</html>
